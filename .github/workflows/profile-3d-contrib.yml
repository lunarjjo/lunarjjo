name: "profile-3d-contrib"

# Grafik kontribusi 3D (profile-3d-contrib) — ditiru dari profil pemilik.
# SVG di-commit ke main di folder profile-3d-contrib/, dipakai README seksi Statistik.

on:
  schedule:
    - cron: "30 2 * * *" # regenerasi harian 02:30 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: generate 3d-contrib
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: commit & push (hanya jika ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "tidak ada perubahan — skip commit"
          else
            git commit -m "chore: regenerate profile-3d-contrib"
            git push
          fi
